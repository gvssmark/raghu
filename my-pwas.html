<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">
<title>My PWAs</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #1565c0;
    color: white;
    text-align: center;
    padding: 18px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 5px 0 0;
    font-size: 14px;
    opacity: .9;
}

.container {
    width: min(1100px, 94%);
    margin: 24px auto 40px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 18px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px 15px;
    text-align: center;
    text-decoration: none;
    color: #222;
    box-shadow: 0 3px 12px rgba(0,0,0,.10);
    transition: transform .18s ease, box-shadow .18s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 245px;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 7px 20px rgba(0,0,0,.16);
}

.card:active {
    transform: scale(.98);
}

.icon {
    width: 128px;
    height: 128px;
    object-fit: contain;
    border-radius: 22px;
    margin-bottom: 15px;
}

.title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    margin-top: auto;
}

.open {
    margin-top: 10px;
    padding: 7px 16px;
    border-radius: 20px;
    background: #1565c0;
    color: white;
    font-size: 13px;
}

footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 10px 0 25px;
}

@media (max-width: 500px) {
    header h1 { font-size: 23px; }

    .container {
        width: 92%;
        margin-top: 18px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .card {
        min-height: 205px;
        padding: 14px 8px;
        border-radius: 14px;
    }

    .icon {
        width: 100px;
        height: 100px;
        border-radius: 18px;
        margin-bottom: 10px;
    }

    .title {
        font-size: 15px;
    }

    .open {
        font-size: 12px;
        padding: 6px 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>My PWAs</h1>
    <p>Personal Web Applications</p>
</header>

<main class="container">
<div class="grid">

<a class="card" href="https://famtree.gvssmark.in/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://famtree.gvssmark.in/images/FT512.png" alt="Family Tree">
    <div class="title">Family Tree</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://ibra.gvssmark.in/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://ibra.gvssmark.in/images/ibra512.png" alt="IBRA Address Book">
    <div class="title">IBRA Address Book</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://ibap.gvssmark.in/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://ibap.gvssmark.in/images/ibap512.png" alt="IBAP Address Book">
    <div class="title">IBAP Address Book</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://gvssmark.github.io/pothanaNew/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://gvssmark.github.io/pothanaNew/icons/icon-512.png" alt="Pothana Version 1">
    <div class="title">Pothana<br>Version 1</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://gvssmark.github.io/pothana/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://gvssmark.github.io/pothana/icon-512.png" alt="Pothana Version 2">
    <div class="title">Pothana<br>Version 2</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://gvssmark.github.io/hamsapwa/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://gvssmark.github.io/hamsapwa/icons/icon-512.png" alt="HAMSA">
    <div class="title">HAMSA</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://gvssmark.github.io/raghu/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://gvssmark.github.io/raghu/icons/icon-512.png" alt="Raghuvamsa Version 1">
    <div class="title">Raghuvamsa<br>Version 1</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://gvssmark.github.io/raghu/v2/index.html" target="_blank" rel="noopener">
    <img class="icon" src="https://gvssmark.github.io/raghu/v2/icons/icon-512.png" alt="Raghuvamsa Version 0">
    <div class="title">Raghuvamsa<br>Version 0</div>
    <div class="open">Open PWA</div>
</a>

<a class="card" href="https://vanamalamma.gvssmark.in" target="_blank" rel="noopener">
    <img class="icon" src="https://vanamalamma.gvssmark.in/icon-512.png" alt="Vanamalamma">
    <div class="title">Vanamalamma</div>
    <div class="open">Open PWA</div>
</a>

</div>
</main>

<footer>My Progressive Web Applications</footer>

</body>
</html>
